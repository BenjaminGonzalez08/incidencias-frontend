<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle de incidencia | Mesa técnica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
    <header id="site-header"></header>
    <main class="container-fluid app-container py-4 py-lg-5">
        <div id="global-alert" class="alert d-none" role="alert"></div>
        <section id="detail-view">
            <div class="detail-toolbar">
                <a id="back-to-incidents" class="btn btn-primary" href="cliente.html">
                    <i class="bi bi-arrow-left me-2"></i>Volver al listado
                </a>
                <div class="detail-user-summary">
                    <strong id="current-user-name"></strong>
                    <span id="current-user-role"></span>
                </div>
                <button id="detail-logout-button" class="btn btn-outline-secondary" type="button">
                    <i class="bi bi-box-arrow-right me-1"></i>Salir
                </button>
            </div>
            <div id="incident-detail"></div>
        </section>
    </main>
    <footer id="site-footer"></footer>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/helpers.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sesiones.js"></script>
    <script src="js/componentes/comentarios.js"></script>
    <script src="js/paginas/detalle.js"></script>
    <script src="js/app.js"></script>
    <script src="js/layout.js"></script>
</body>
</html>
