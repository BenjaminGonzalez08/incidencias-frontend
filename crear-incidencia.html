<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Nueva incidencia | Mesa técnica</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
	<link href="css/app.css" rel="stylesheet">
</head>
<body data-required-role="cliente">
	<header id="site-header"></header>
	<main class="container-fluid app-container py-4 py-lg-5">
		<div id="global-alert" class="alert d-none" role="alert"></div>
		<section class="sub-view">
			<a class="back-link" href="cliente.html">
				<i class="bi bi-arrow-left"></i> Volver a mis incidencias
			</a>
			<div class="form-heading">
				<p class="eyebrow">Nuevo registro</p>
				<h1>Crear incidencia</h1>
				<p>Contanos qué está pasando para que el equipo pueda ayudarte.</p>
			</div>
			<form id="incident-form" class="content-form">
				<div class="mb-3">
					<label for="incident-title" class="form-label">Título</label>
					<input id="incident-title" class="form-control" maxlength="255" required placeholder="Ej. La impresora no responde">
				</div>
				<div class="mb-3">
					<label for="incident-description" class="form-label">Descripción</label>
					<textarea id="incident-description" class="form-control" rows="5" required placeholder="Describí el problema y cuándo comenzó"></textarea>
				</div>
				<div class="mb-4">
					<label for="incident-category" class="form-label">Categoría</label>
					<select id="incident-category" class="form-select" required>
						<option value="">Seleccioná una categoría</option>
					</select>
				</div>
				<div class="d-flex gap-2">
					<button class="btn btn-primary" type="submit">
						<span class="button-label">Registrar incidencia</span>
						<span class="spinner-border spinner-border-sm d-none"></span>
					</button>
					<a class="btn btn-light" href="cliente.html">Cancelar</a>
				</div>
			</form>
		</section>
	</main>
	<footer id="site-footer"></footer>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
	<script src="js/helpers.js"></script>
	<script src="js/api.js"></script>
	<script src="js/sesiones.js"></script>
	<script src="js/paginas/listado.js"></script>
	<script src="js/paginas/creacion.js"></script>
	<script src="js/app.js"></script>
	<script src="js/layout.js"></script>
</body>
</html>
