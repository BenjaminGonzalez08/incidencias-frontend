<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ingresar | Mesa técnica</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>
    <main class="login-shell">
        <section class="login-panel">
            <p class="eyebrow">Mesa técnica escolar</p>
            <h1>Resolver empieza por registrar.</h1>
            <p class="login-copy">Gestioná tus incidencias y seguí cada avance desde un solo lugar.</p>
            <form id="login-form" class="mt-4">
                <div class="mb-3"><label for="login-email" class="form-label">Correo electrónico</label><input id="login-email" type="email" class="form-control form-control-lg" required autocomplete="email"></div>
                <div class="mb-3"><label for="login-password" class="form-label">Contraseña</label><input id="login-password" type="password" class="form-control form-control-lg" required autocomplete="current-password"></div>
                <div id="login-alert" class="alert d-none" role="alert"></div>
                <button class="btn btn-primary btn-lg w-100" type="submit"><span class="button-label">Ingresar</span><span class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span></button>
            </form>
        </section>
        <aside class="login-aside"><span class="aside-number">01</span><h2>Una señal clara para cada problema.</h2><p>Registrá, asigná y resolvé incidencias con trazabilidad para toda la institución.</p><div class="aside-rule"></div><small>DESARROLLO DE SOFTWARE · 2026</small></aside>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
