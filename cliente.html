<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cliente | Mesa técnica</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="css/app.css" rel="stylesheet"></head>
<body data-required-role="cliente">
<header id="site-header"></header>
<main class="container-fluid app-container py-4 py-lg-5"><div id="global-alert" class="alert d-none" role="alert"></div><section id="incidents-view"><div class="page-heading"><div><p class="eyebrow">Panel del cliente</p><h1>Mis incidencias</h1><p class="page-description">Registrá problemas y seguí cada avance.</p></div><a id="new-incident-button" class="btn btn-primary" href="crear-incidencia.html"><i class="bi bi-plus-lg me-1"></i>Nueva incidencia</a></div><div class="filter-bar"><div class="filter-title"><i class="bi bi-sliders2"></i><span>Filtrar vista</span></div><div class="row g-2 flex-grow-1"><div class="col-12 col-md-4"><select id="status-filter" class="form-select"><option value="">Todos los estados</option><option value="abierto">Abierta</option><option value="en_curso">En curso</option><option value="finalizado">Finalizada</option></select></div><div class="col-12 col-md-4"><select id="category-filter" class="form-select"><option value="">Todas las categorías</option></select></div><div class="col-12 col-md-auto"><button id="clear-filters" class="btn btn-light w-100" type="button">Limpiar</button></div></div></div><div class="table-wrap"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>ID</th><th>Incidencia</th><th>Categoría</th><th>Estado</th><th>Técnico</th><th></th></tr></thead><tbody id="incidents-table-body"><tr><td colspan="6" class="empty-state">Cargando incidencias...</td></tr></tbody></table></div></div></section><section id="detail-view" class="sub-view d-none"><button class="back-link" data-view="incidents" type="button"><i class="bi bi-arrow-left"></i> Volver a mis incidencias</button><div id="incident-detail"></div></section></main>
